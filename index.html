<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AR Serangga Afid</title>

<script type="module"
  src="https://cdn.jsdelivr.net/npm/@google/model-viewer/dist/model-viewer.min.js">
</script>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(#e8f5e9, #ffffff);
      text-align: center;
    }

    h1 {
      color: #2e7d32;
      margin-bottom: 5px;
    }

    p {
      color: #555;
    }

    model-viewer {
      width: 100%;
      height: 70vh;
      background-color: transparent;
    }

    #ar-button {
      background-color: #2e7d32;
      color: white;
      border: none;
      border-radius: 30px;
      padding: 15px 25px;
      font-size: 18px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h1>Serangga Afid</h1>

  <p>
    Putarkan model 3D untuk melihat serangga dari pelbagai sudut.
  </p>

  <model-viewer
    src="afid-final.glb"
    alt="Model 3D serangga afid"
    camera-controls
    auto-rotate
    ar
    ar-modes="webxr scene-viewer quick-look"
    shadow-intensity="1">

    <button slot="ar-button" id="ar-button">
      📱 LIHAT DALAM AR
    </button>

  </model-viewer>

</body>
</html>
